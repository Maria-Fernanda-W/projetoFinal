spring.application.name=revisa-ai

spring.config.import=optional:file:.env[.properties],optional:file:./back/revisa-ai/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/revisaai_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiracao-ms=86400000